services:
  customs-agent-public:
    build:
      context: .
      dockerfile: Dockerfile.public
    container_name: customs-rag-agent-public
    restart: unless-stopped
    env_file:
      - .env.public
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data-public:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
