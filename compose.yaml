services:
  customs-agent:
    build: .
    container_name: customs-rag-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 只允许服务器本机访问；后续通过 HTTPS 反向代理对外提供服务。
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
